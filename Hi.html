<!DOCTYPE html>
<html>
<body>
<button id="NumaIei" onclick="Oof()">Text of button</button>
<script>

let size = 2
document.getElementById("NumaIei").style.fontSize = "2px"

function Oof() {
size += 2;
document.getElementById("NumaIei").style.fontSize = size + "px"
}

</script>
</body>
</html>
